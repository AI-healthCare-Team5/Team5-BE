name: Close linked issues and delete branch on develop merge

on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  contents: write       # 머지된 브랜치 삭제
  issues: write         # 연결된 이슈 닫기
  pull-requests: read

jobs:
  cleanup:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close linked issues
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const regex = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
            const issueNumbers = new Set([...body.matchAll(regex)].map(m => Number(m[1])));

            for (const issueNumber of issueNumbers) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `#${pr.number} PR이 develop에 머지되어 이슈를 닫습니다.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`Closed issue #${issueNumber}`);
            }

      - name: Delete merged branch
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;
            const protectedBranches = ['main', 'develop'];

            if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.info('Fork PR: skip branch deletion');
              return;
            }
            if (protectedBranches.includes(branch)) {
              core.info(`Protected branch '${branch}': skip deletion`);
              return;
            }

            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
              core.info(`Deleted branch '${branch}'`);
            } catch (error) {
              if (error.status === 422 || error.status === 404) {
                core.info(`Branch '${branch}' already deleted`);
              } else {
                throw error;
              }
            }
