# =====================================================================
# 개발 서버(jinryo-dev) 배포. 자동 실행(push)은 아직 꺼 두었습니다.
# - 수동 실행(workflow_dispatch)은 이 파일이 기본 브랜치(main)에 들어간 뒤 Actions 탭에 나타납니다.
# - 실행할 때 브랜치는 develop을 고릅니다. AWS 배포 Role이 develop에서만 허용됩니다.
# - EC2에는 SSH 대신 SSM Run Command로 명령을 보냅니다(22번 포트를 열지 않음).
# - 이전 컨테이너를 먼저 멈추므로 새 컨테이너가 뜰 때까지(최대 3분) /api는 502를 응답합니다.
# 필요한 Secrets: AWS_DEPLOY_ROLE_ARN, DEPLOY_S3_BUCKET, DEV_EC2_INSTANCE_ID
# =====================================================================
name: Deploy DEV

on:
  # push:
  #   branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # GitHub OIDC로 AWS Role 사용

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  IMAGE_NAME: team5-be
  CONTAINER_NAME: team5-be-dev
  S3_PREFIX: dev

jobs:
  deploy:
    # 배포 Role의 신뢰 조건(develop)과 맞지 않는 브랜치에서는 실행하지 않습니다.
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # EC2는 t3.small(x86_64)이고 GitHub 러너도 x86_64라 별도 플랫폼 지정이 필요 없습니다.
      - name: Build Docker image
        # pipefail을 켜서 docker save가 실패하면 이 단계도 실패하게 합니다.
        shell: bash
        run: |
          docker build -t "$IMAGE_NAME:${{ github.sha }}" .
          docker save "$IMAGE_NAME:${{ github.sha }}" | gzip > image.tar.gz

      - name: Upload image to S3
        run: |
          aws s3 cp image.tar.gz \
            "s3://${{ secrets.DEPLOY_S3_BUCKET }}/$S3_PREFIX/$IMAGE_NAME-${{ github.sha }}.tar.gz"

      - name: Run container on EC2 (SSM)
        env:
          INSTANCE_ID: ${{ secrets.DEV_EC2_INSTANCE_ID }}
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          S3_OBJECT: s3://${{ secrets.DEPLOY_S3_BUCKET }}/${{ env.S3_PREFIX }}/${{ env.IMAGE_NAME }}-${{ github.sha }}.tar.gz
        run: |
          # EC2에서 root로 실행할 스크립트. 값은 맨 앞 변수 줄로만 넘깁니다.
          {
            printf 'AWS_REGION=%q\nIMAGE=%q\nIMAGE_NAME=%q\nCONTAINER_NAME=%q\nS3_OBJECT=%q\n' \
              "$AWS_REGION" "$IMAGE" "$IMAGE_NAME" "$CONTAINER_NAME" "$S3_OBJECT"
            cat <<'REMOTE'
          set -eu
          cd /opt/team5

          # EC2 IAM Role로 S3에서 이미지 다운로드 (액세스 키 불필요)
          # 진행률 출력이 SSM 출력(앞부분 24,000자)을 채워 실패 로그가 잘리지 않게 합니다.
          aws s3 cp "$S3_OBJECT" image.tar.gz --region "$AWS_REGION" --only-show-errors
          gunzip -c image.tar.gz | docker load
          rm -f image.tar.gz

          # 이전 컨테이너는 새 컨테이너가 정상 기동할 때까지 보관
          PREVIOUS_NAME="$CONTAINER_NAME-previous"
          docker rm -f "$PREVIOUS_NAME" 2>/dev/null || true
          if docker inspect "$CONTAINER_NAME" >/dev/null 2>&1; then
            docker stop "$CONTAINER_NAME"
            docker rename "$CONTAINER_NAME" "$PREVIOUS_NAME"
          fi

          # 호스트 포트는 열지 않습니다. Caddy가 jinryo 네트워크에서 team5-be-dev:8080으로 넘깁니다.
          # 메모리 2GB를 Redis, Caddy와 나눠 쓰므로 컨테이너 메모리와 JVM 힙 상한을 둡니다.
          STARTED=false
          if docker run -d \
            --name "$CONTAINER_NAME" \
            --network jinryo \
            --restart unless-stopped \
            --memory 1g \
            --log-opt max-size=10m --log-opt max-file=3 \
            --env-file /opt/team5/.env.dev \
            -e SPRING_PROFILES_ACTIVE=dev \
            -e JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70 \
            "$IMAGE"; then
            for _ in $(seq 1 36); do
              if docker logs "$CONTAINER_NAME" 2>&1 | grep -q "Started JinryohanjangApplication"; then
                STARTED=true
                break
              fi
              if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER_NAME" 2>/dev/null)" != "true" ]; then
                break
              fi
              sleep 5
            done
          fi

          if [ "$STARTED" != "true" ]; then
            echo "새 컨테이너가 기동하지 못했습니다. 이전 컨테이너로 되돌립니다."
            docker logs --tail 80 "$CONTAINER_NAME" 2>&1 || true
            docker rm -f "$CONTAINER_NAME" || true
            if docker inspect "$PREVIOUS_NAME" >/dev/null 2>&1; then
              docker rename "$PREVIOUS_NAME" "$CONTAINER_NAME"
              docker start "$CONTAINER_NAME"
            fi
            exit 1
          fi

          docker rm "$PREVIOUS_NAME" 2>/dev/null || true
          echo "배포 완료: $IMAGE"

          # EC2에는 최근 이미지 3개만 남김 (이전 버전은 S3에 30일 보관)
          docker images "$IMAGE_NAME" --format '{{.Repository}}:{{.Tag}}' \
            | tail -n +4 \
            | xargs -r docker rmi || true
          REMOTE
          } > remote.sh

          PARAMS=$(jq -n --rawfile script remote.sh \
            '{commands: [$script], executionTimeout: ["900"]}')
          # --timeout-seconds: EC2에 5분 안에 전달되지 않으면 명령을 버립니다(나중에 몰래 배포되는 것 방지).
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 300 \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          echo "SSM command: $COMMAND_ID"

          # EC2 실행 제한(900초)과 전달 대기(300초)를 넘길 때까지 최대 20분 결과를 기다립니다.
          # 그래서 CI가 실패로 끝난 뒤 EC2에서 배포가 계속 진행되는 일이 없습니다.
          STATUS=Pending
          for _ in $(seq 1 240); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          echo "SSM status: $STATUS"
          [ "$STATUS" = "Success" ]
