server:
  port: 8080

app:
  encryption:
    key: ${DATA_ENCRYPTION_KEY:}

spring:
  application:
    name: jinryohanjang

  profiles:
    default: local

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

springdoc:
  # 전역 예외 처리기의 응답이 모든 API에 붙지 않게 함 (API별 응답은 설명에 적음)
  override-with-generic-response: false
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
