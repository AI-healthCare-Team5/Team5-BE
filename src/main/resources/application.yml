server:
  port: 8080

app:
  encryption:
    key: ${DATA_ENCRYPTION_KEY:}

spring:
  application:
    name: jinryohanjang

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jinryohanjang}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
