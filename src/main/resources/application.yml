server:
  port: 8080

app:
  encryption:
    key: ${DATA_ENCRYPTION_KEY:}

spring:
  application:
    name: jinryohanjang

  profiles:
    default: local

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
