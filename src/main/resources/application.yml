server:
  port: 8080

app:
  encryption:
    key: ${DATA_ENCRYPTION_KEY:}

spring:
  application:
    name: jinryohanjang

  profiles:
    default: local

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 미지정 시 Redis 장애 때 요청이 최대 60초 대기함
      timeout: 2s
      connect-timeout: 2s

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
