# 개발 서버(dev) 설정
# 실행: SPRING_PROFILES_ACTIVE=dev
# application.yml의 공통 설정 위에 아래 값만 덮어씁니다.

server:
  # ALB/Nginx 뒤에서 X-Forwarded-* 헤더를 인식 (HTTPS, Secure 쿠키, 리다이렉트 URL)
  forward-headers-strategy: native

spring:
  datasource:
    # 기본값 없음: 환경 변수가 없으면 서버가 시작되지 않음 (로컬 DB로 잘못 붙는 것 방지)
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false

logging:
  level:
    org.hibernate.SQL: info
